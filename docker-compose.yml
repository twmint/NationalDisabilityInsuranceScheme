services:
  postgres:
    image: postgres:18
    container_name: ndis-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - ndis_pgdata:/var/lib/postgresql/
      - ./src/database/init:/docker-entrypoint-initdb.d
      
volumes:
  ndis_pgdata:
